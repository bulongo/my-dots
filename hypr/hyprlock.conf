background {
    monitor =
    path = screenshot   # or path to a wallpaper image
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = false
    fade_on_empty = true
    placeholder_text = <i>Input Password...</i> # Text rendered in the input box
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

