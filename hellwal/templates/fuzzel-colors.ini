[main]
font=JetBrainsMono Nerd Font:size=7
prompt= "=> "
terminal=kitty
layer=overlay

width=55
horizontal-pad=20
vertical-pad=12
inner-pad=6

lines=6
line-height=25

[border]
width=1
radius=10

[colors]
background=%%background.hex%%ff
prompt=%%color2.hex%%ff
text=%%foreground.hex%%ff
placeholder=%%foreground.hex%%ff
input=%%foreground.hex%%ff
match=%%color2.hex%%ff

selection=%%color8.hex%%ff
selection-text=%%foreground.hex%%ff
selection-match=%%color2.hex%%ff

border=%%color2.hex%%ff

[dmenu]
exit-immediately-if-empty=no
